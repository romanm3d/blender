
name: Build Blender Android Full

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    timeout-minutes: 360

    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: android
          lfs: false
          submodules: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-14 g++-14 cmake ninja-build \
            patchelf zip unzip git-lfs openjdk-17-jdk \
            python3 curl xz-utils bison flex pkg-config

      - name: Fetch Blender LFS and dependencies
        run: |
          git lfs install --local
          git config lfs.url \
            https://projects.blender.org/blender/blender.git/info/lfs
          git config --local \
            'credential.https://projects.blender.org.helper' \
            '!f() { echo username=; echo password=; }; f'
          git lfs pull

          git -c submodule.lib/linux_x64.update=checkout \
            submodule update --init lib/linux_x64
          git submodule update --init lib/android_arm64

          git -C lib/linux_x64 lfs install --local
          git -C lib/linux_x64 lfs pull

          df -h /

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Prepare Android packages
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"
          NDK_VERSION="30.0.14904198"
          NDK_ALIAS="30.0.14904198-beta1"

          mkdir -p "$SDK"

          yes | sdkmanager --sdk_root="$SDK" --licenses || true

          sdkmanager --sdk_root="$SDK" --channel=3 \
            "ndk;$NDK_VERSION" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35"

          if [ ! -e "$SDK/ndk/$NDK_ALIAS" ]; then
            ln -s "$NDK_VERSION" "$SDK/ndk/$NDK_ALIAS"
          fi

          echo "=== Verify Android toolchain ==="
          echo "ANDROID_HOME=$SDK"
          echo "NDK=$SDK/ndk/$NDK_ALIAS"
          test -f "$SDK/ndk/$NDK_ALIAS/build/cmake/android.toolchain.cmake"
          command -v ninja
          ninja --version

          echo "=== Verify env.sh uses the expected paths ==="
          source build_files/android/env.sh
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-unset}"
          echo "ANDROID_TOOLCHAIN_FILE=${ANDROID_TOOLCHAIN_FILE:-unset}"
          test -f "$HOME/android-sdk/ndk/$NDK_ALIAS/build/cmake/android.toolchain.cmake"
          echo "Android toolchain checks passed."

      - name: Prepare Vulkan headers
        run: |
          mkdir -p ../blender_build_android/lib/vulkan_headers
          curl -fL \
            https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.341.tar.gz \
            -o /tmp/vulkan-headers.tar.gz
          tar -xzf /tmp/vulkan-headers.tar.gz -C /tmp
          cp -R /tmp/Vulkan-Headers-1.4.341/include \
            ../blender_build_android/lib/vulkan_headers/include

      - name: Build APK
        run: |
          python3 build_files/android/build.py full
      - name: Prepare APK artifact
        if: success()
        run: |
          mkdir -p artifacts
          cp ../blender_build_android/android_apk_stage_full/blender-full.apk artifacts/blender-full.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-full
          path: artifacts/blender-full.apk
          if-no-files-found: error
          retention-days: 7
